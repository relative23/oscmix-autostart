name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # A newer PR revision makes an older run obsolete; main runs are kept.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    name: Lint, Types & Dead Code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: make lint
      - run: make typecheck
      - run: make deadcode
      # tests/test_unit_file.py matches strings; only systemd knows the
      # directive *names*, and an unknown key is silently ignored rather
      # than rejected. The runner has systemd, so the skip does not fire
      # here -- if it ever does, that is a broken image, not a pass.
      - name: Validate the systemd unit
        run: |
          status=0
          ./scripts/verify-unit.sh || status=$?
          if [ "$status" -eq 77 ]; then
            echo "systemd-analyze is missing on this runner; the unit was" \
                 "not validated at all" >&2
            exit 1
          fi
          exit "$status"

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor the code is written against (no PEP 604 unions);
        # the newest release guards against upcoming stdlib changes.
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # A checkout without hypothesis skips tests/test_contracts.py in
      # full and still reports green. CI must never be that checkout, so
      # here the skip is a collection error rather than a banner.
      - run: make test
        env:
          OSCMIX_REQUIRE_CONTRACTS: "1"

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The threshold lives in pyproject.toml as a ratchet.
      - run: make coverage
        env:
          OSCMIX_REQUIRE_CONTRACTS: "1"
      - run: python -m coverage html
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

  flake:
    name: Flakiness Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      # The suite binds real UDP sockets and drives background threads, so
      # a single green run proves little -- a teardown race in the device
      # fakes survived several full runs before it was caught.
      - run: make flake

  mutation:
    name: Mutation Score
    # Not a blocking gate: ~15 minutes, and its number moves for reasons
    # other than test quality (new code brings new mutants). It reports;
    # the policy script fails only when the *score* drops.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt mutmut
      - run: make mutation
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        if: always()
        with:
          name: mutation-stats
          path: mutants/mutmut-cicd-stats.json
          if-no-files-found: ignore
          retention-days: 14

  build-oscmix:
    name: Build Upstream oscmix
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      # Proves install.sh can build upstream oscmix on a clean system.
      - run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config libasound2-dev libgtk-3-dev \
            libglib2.0-dev-bin
      # The pinned revision, not master: the point of the pin is that CI
      # builds the same backend the hardware measurements were taken
      # against. install.sh carries the SHA.
      - name: Build the pinned upstream revision
        run: |
          ref=$(sed -n 's/^OSCMIX_REF="\${OSCMIX_REF:-\(.*\)}"$/\1/p' install.sh)
          test -n "$ref" || { echo "no pinned OSCMIX_REF in install.sh"; exit 1; }
          echo "pinned upstream ref: $ref"
          git clone --quiet https://github.com/michaelforney/oscmix build/oscmix
          git -C build/oscmix checkout --quiet "$ref"
          test "$(git -C build/oscmix rev-parse HEAD)" = "$ref"
          make -C build/oscmix
          test -x build/oscmix/oscmix
          test -x build/oscmix/alsaseqio
          test -x build/oscmix/gtk/oscmix-gtk
      # A dry run against a fake /proc resolves the config and prints the
      # exact OSC messages the routing produces -- the cheapest end-to-end
      # check that links are still emitted before the mix matrix.
      - name: Dry-run the routing and assert the phase order
        run: |
          mkdir -p fake-proc/asound/seq
          cat > fake-proc/asound/seq/clients <<'EOF'
          Client info
            cur  clients : 2

          Client   0 : "System" [Kernel]
          Client  42 : "Fireface UCX II (00000000)" [Kernel]
            Port   1 : "Port" (RWeX) [In/Out]
          EOF
          # Two routes on purpose: with one route the per-route order and
          # the real order coincide, so a single-route config cannot show
          # the defect this check guards. The dry run prints the same plan
          # apply_routing sends (see test_the_dry_run_prints_exactly_the_
          # datagrams_the_apply_sends), so the printed order is evidence.
          OSCMIX_PROC_ROOT=fake-proc python bin/oscmix-session \
            --config tests/data/two-routes.conf --dry-run 2>&1 | tee dry-run.txt
          last_link=$(grep -n "would send: .*/stereo " dry-run.txt \
            | tail -1 | cut -d: -f1)
          first_mix=$(grep -n "would send: /mix/" dry-run.txt \
            | head -1 | cut -d: -f1)
          test -n "$last_link" && test -n "$first_mix"
          # Every link of every route, then the barrier, then every mix.
          test "$last_link" -lt "$first_mix" \
            || { echo "mix matrix written before the last channel link"; exit 1; }
          test "$(grep -c 'would send: .*/stereo ' dry-run.txt)" -eq 4
          test "$(grep -c 'would send: /mix/' dry-run.txt)" -eq 2
