# Two routes, for the end-to-end phase-order check in CI.
#
# Not config/routing.conf.example: that file is installed into a user's
# ~/.config and ships with one active route on purpose. But one route
# cannot exhibit the bug class the check exists for -- with a single
# route, walking route by route and emitting link, mix, link, mix
# happens to agree with the real order, in which every link of every
# route goes out before any mix write. Two routes separate them.

[device]
name = Fireface UCX II
usb-id = 2a39:3fd9

[osc]
port = 7222

[route:main-out]
playback = 1/2
output = 1/2
level = 0.0

[route:monitors]
playback = 3/4
output = 7/8
level = -6.0
